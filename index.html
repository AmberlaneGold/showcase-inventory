<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase Audit</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      margin-top: 40px;
      text-align: center;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .qty {
      font-size: 18px;
      color: #555;
      margin-bottom: 20px;
    }

    .progress {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
    }

    .yes {
      background: #2ecc71;
      color: white;
    }

    .no {
      background: #e74c3c;
      color: white;
    }

    .skip {
      background: #95a5a6;
      color: white;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <div class="title" id="name">Loading...</div>
    <div class="qty">Qty: <span id="qty"></span></div>

    <div class="progress" id="progress"></div>

    <button class="yes" onclick="mark(true)">YES (Present)</button>
    <button class="no" onclick="mark(false)">NO (Missing)</button>
    <button class="skip" onclick="skip()">SKIP</button>

    <div id="status"></div>
  </div>

</div>

<script>
const SCRIPT_URL = "PASTE_YOUR_SCRIPT_URL_HERE";

let currentRow = 1;
let total = 0;

function loadNext() {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: new URLSearchParams({
      action: "getNext"
    })
  })
  .then(r => r.json())
  .then(data => {
    if (!data) {
      document.body.innerHTML = "<h2 style='text-align:center;margin-top:100px;'>All items complete ✅</h2>";
      return;
    }

    currentRow = data.row;
    total = data.total || total;

    document.getElementById("name").innerText = data.name;
    document.getElementById("qty").innerText = data.qty;

    document.getElementById("progress").innerText =
      "Item " + data.row + " of ~" + (total || "?");

    document.getElementById("status").innerText = "";
  });
}

function mark(present) {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: new URLSearchParams({
      action: "update",
      row: currentRow,
      present: present
    })
  }).then(() => loadNext());
}

function skip() {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: new URLSearchParams({
      action: "skip",
      row: currentRow
    })
  }).then(() => loadNext());
}

loadNext();
</script>

</body>
</html>

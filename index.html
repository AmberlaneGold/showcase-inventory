<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f2f2f2;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 90%;
  max-width: 420px;
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  text-align: center;
}

.name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.meta {
  color: #666;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

.yes { background: #27ae60; color: white; }
.no { background: #c0392b; color: white; }
.skip { background: #7f8c8d; color: white; }

.row {
  display: flex;
  gap: 10px;
}

.small {
  font-size: 12px;
  color: #777;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="card">

  <div class="name" id="name">Loading...</div>

  <div class="meta">
    Qty: <span id="qty"></span> |
    Price: $<span id="price"></span>
  </div>

  <input id="priceInput" type="number" placeholder="Price">

  <button class="yes" onclick="yes()">YES</button>
  <button class="no" onclick="missing()">MISSING</button>

  <div class="row">
    <button class="skip" onclick="back()">⬅ Back</button>
    <button class="skip" onclick="next()">Skip ➡</button>
  </div>

  <button class="skip" onclick="refresh()">🔄 Refresh</button>

  <div class="small" id="status">Loading...</div>

</div>

<script>

const URL = "https://script.google.com/macros/s/AKfycbwhb6kpe1-dZXZx3W8sXhAfjujIsFwGrVWeI0ZWZkRdf6mCU_nD9-ow-sVqCYAnTwBeig/exec";

let items = [];
let i = 0;

/* ---------------- LOAD ---------------- */

async function load() {
  document.getElementById("status").innerText = "Loading...";

  const res = await fetch(URL + "?action=batch");
  const data = await res.json();

  items = data.items || [];

  if (!items.length) {
    document.getElementById("status").innerText = "No items found";
    return;
  }

  i = 0;
  render();
}

/* ---------------- RENDER ---------------- */

function render() {
  const item = items[i];

  document.getElementById("name").innerText = item.name;
  document.getElementById("qty").innerText = item.qty;
  document.getElementById("price").innerText = item.price;

  // 🔥 CHANGED: show actual sheet row only
  document.getElementById("status").innerText =
    `Row ${item.row}`;
}

/* ---------------- ACTIONS ---------------- */

function yes() {
  const item = items[i];
  const price = document.getElementById("priceInput").value;

  fetch(URL + "?action=yes&row=" + item.row + "&price=" + price);

  next();
}

function missing() {
  const item = items[i];

  fetch(URL + "?action=missing&row=" + item.row);

  next();
}

/* ---------------- NAVIGATION ---------------- */

function next() {
  if (i < items.length - 1) {
    i++;
    render();
  } else {
    refresh();
  }
}

function back() {
  if (i > 0) {
    i--;
    render();
  }
}

/* ---------------- REFRESH ---------------- */

async function refresh() {
  await load();
}

/* ---------------- START ---------------- */

load();

</script>

</body>
</html>

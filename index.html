<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase Audit</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial;
  margin: 0;
  background: #f2f2f2;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
}

.name {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 10px;
}

.meta {
  color: #666;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 17px;
  border-radius: 12px;
  border: none;
  margin-top: 8px;
}

.yes { background: #27ae60; color: white; }
.no { background: #c0392b; color: white; }
.skip { background: #7f8c8d; color: white; }

.row {
  display: flex;
  gap: 10px;
}

#progressWrap {
  height: 10px;
  background: #ddd;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #27ae60;
  transition: width 0.2s;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="name" id="name">Loading...</div>

    <div class="meta">
      Qty: <span id="qty"></span> |
      Price: $<span id="price"></span>
    </div>

    <input id="priceInput" type="number" placeholder="Update price (optional)">

    <button class="yes" id="yesBtn">YES</button>
    <button class="no" onclick="missing()">MISSING (hold YES)</button>

    <div class="row">
      <button class="skip" onclick="skip()">SKIP</button>
      <button class="skip" onclick="back()">BACK</button>
    </div>

  </div>
</div>

<div id="progressWrap">
  <div id="progressBar"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwB5dQUxJwzDCj_mw4uuq5OAqR5IMmKgtLYVfPOxUHQ8Gpxn8ARQs5G5udhXHTyZ2aycw/exec";

let batch = [];
let index = 0;
let currentRow = null;

let startRow = 1;
let lastSheetRow = 1;

let isProcessing = false;
let pressTimer;

/* LOAD */
function loadBatch() {
  fetch(SCRIPT_URL + "?action=batch")
    .then(r => r.json())
    .then(data => {

      batch = data.items;
      index = 0;

      if (!batch.length) {
        document.body.innerHTML =
          "<h2 style='text-align:center;margin-top:100px;'>Done ✅</h2>";
        return;
      }

      startRow = batch[0].row;
      lastSheetRow = data.lastRow;

      render(batch[index]);
    });
}

/* RENDER */
function render(item) {
  currentRow = item.row;

  document.getElementById("name").innerText = item.name;
  document.getElementById("qty").innerText = item.qty;
  document.getElementById("price").innerText = item.price;

  document.getElementById("priceInput").value = "";

  updateProgress();
}

/* NEXT */
function nextLocal() {
  index++;
  if (index >= batch.length) {
    loadBatch();
  } else {
    render(batch[index]);
  }
}

/* PROGRESS */
function updateProgress() {
  if (!currentRow || !startRow || !lastSheetRow) return;

  let percent =
    ((currentRow - startRow) / (lastSheetRow - startRow)) * 100;

  percent = Math.max(0, Math.min(100, percent));

  document.getElementById("progressBar").style.width = percent + "%";
}

/* YES */
function yes() {
  if (isProcessing) return;
  isProcessing = true;

  const rowToUpdate = currentRow;
  const price = document.getElementById("priceInput").value;

  nextLocal();

  fetch(SCRIPT_URL + "?action=yes&row=" + rowToUpdate + "&price=" + price)
    .finally(() => {
      isProcessing = false;
    });
}

/* MISSING */
function missing() {
  if (isProcessing) return;
  isProcessing = true;

  const rowToUpdate = currentRow;

  nextLocal();

  fetch(SCRIPT_URL + "?action=missing&row=" + rowToUpdate)
    .finally(() => {
      isProcessing = false;
    });
}

/* SKIP */
function skip() {
  if (isProcessing) return;
  isProcessing = true;

  const rowToUpdate = currentRow;

  nextLocal();

  fetch(SCRIPT_URL + "?action=skip&row=" + rowToUpdate)
    .finally(() => {
      isProcessing = false;
    });
}

/* BACK */
function back() {
  if (isProcessing) return;

  if (index > 0) {
    index--;
    render(batch[index]);
  } else {
    fetch(SCRIPT_URL + "?action=back")
      .then(() => loadBatch());
  }
}

/* LONG PRESS (SAFE) */
const yesBtn = document.getElementById("yesBtn");

yesBtn.addEventListener("pointerdown", () => {
  pressTimer = setTimeout(() => {
    missing();
  }, 700);
});

yesBtn.addEventListener("pointerup", () => {
  clearTimeout(pressTimer);
  yes();
});

yesBtn.addEventListener("pointerleave", () => {
  clearTimeout(pressTimer);
});

/* PREVENT INPUT FROM TRIGGERING BUTTON */
document.getElementById("priceInput").addEventListener("pointerdown", (e) => {
  e.stopPropagation();
});

/* INIT */
loadBatch();
</script>

</body>
</html>

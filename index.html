<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase Audit</title>

<style>
body {
  font-family: -apple-system, Arial;
  margin: 0;
  background: #f2f2f2;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
}

.name {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 10px;
}

.meta {
  color: #666;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 17px;
  border-radius: 12px;
  border: none;
  margin-top: 8px;
}

.yes { background: #27ae60; color: white; }
.no { background: #c0392b; color: white; }
.skip { background: #7f8c8d; color: white; }

.row {
  display: flex;
  gap: 10px;
}

#progressWrap {
  height: 10px;
  background: #ddd;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #27ae60;
  transition: width 0.2s;
}

#status {
  font-size: 12px;
  color: #888;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="name" id="name">Loading...</div>

    <div class="meta">
      Qty: <span id="qty"></span> |
      Price: $<span id="price"></span>
    </div>

    <input id="priceInput" type="number" placeholder="Update price (optional)">

    <button class="yes" onclick="yes()">YES</button>
    <button class="no" onclick="missing()">MISSING</button>

    <div class="row">
      <button class="skip" onclick="skip()">SKIP</button>
      <button class="skip" onclick="back()">BACK</button>
    </div>

    <div id="status">Loading items...</div>

  </div>
</div>

<div id="progressWrap">
  <div id="progressBar"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwquwleZThz900yvRXY2AoIqZp_Lyc1BUKZS68op3NM-jdb-zkmih4-bhPdTD0TiCRzKQ/exec";

let batch = [];
let currentRow = null;
let startRow = 1;
let lastSheetRow = 1;
let locked = false;

/* ---------------- LOAD (NO DONE STATE EVER) ---------------- */

function loadBatch() {
  document.getElementById("status").innerText = "Loading...";

  fetch(SCRIPT_URL + "?action=batch")
    .then(r => r.json())
    .then(data => {

      console.log("SERVER:", data);

      if (!data || !data.items) {
        document.getElementById("status").innerText = "Retrying...";
        setTimeout(loadBatch, 1500);
        return;
      }

      batch = data.items;

      // 🔁 if empty, just retry instead of showing DONE
      if (batch.length === 0) {
        document.getElementById("status").innerText = "No items found — retrying...";
        setTimeout(loadBatch, 1500);
        return;
      }

      startRow = batch[0].row;
      lastSheetRow = data.lastRow;

      render(batch[0]);
    })
    .catch(err => {
      console.log(err);
      document.getElementById("status").innerText = "Connection error — retrying...";
      setTimeout(loadBatch, 2000);
    });
}

/* ---------------- RENDER ---------------- */

function render(item) {
  currentRow = item.row;

  document.getElementById("name").innerText = item.name;
  document.getElementById("qty").innerText = item.qty;
  document.getElementById("price").innerText = item.price;

  document.getElementById("priceInput").value = "";

  document.getElementById("status").innerText = "Row " + currentRow;

  updateProgress();
  locked = false;
}

/* ---------------- PROGRESS ---------------- */

function updateProgress() {
  let percent =
    ((currentRow - startRow) / (lastSheetRow - startRow)) * 100;

  percent = Math.max(0, Math.min(100, percent));

  document.getElementById("progressBar").style.width = percent + "%";
}

/* ---------------- NEXT ---------------- */

function nextItem() {
  const next = batch.find(i => i.row > currentRow);

  if (next) {
    render(next);
  } else {
    // 🔁 instead of DONE → reload new batch
    loadBatch();
  }
}

/* ---------------- ACTIONS ---------------- */

function yes() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=yes&row=" + currentRow + "&price=" + priceInput.value);
  nextItem();
}

function missing() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=missing&row=" + currentRow);
  nextItem();
}

function skip() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=skip&row=" + currentRow);
  nextItem();
}

function back() {
  fetch(SCRIPT_URL + "?action=back")
    .then(() => loadBatch());
}

/* ---------------- START ---------------- */

loadBatch();
</script>

</body>
</html>

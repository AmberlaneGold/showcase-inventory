<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase Audit</title>

<style>
body {
  font-family: -apple-system, Arial;
  margin: 0;
  background: #f2f2f2;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  text-align: center;
}

.name {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 10px;
}

.meta {
  color: #666;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 16px;
  font-size: 17px;
  border-radius: 12px;
  border: none;
  margin-top: 8px;
}

.yes { background: #27ae60; color: white; }
.no { background: #c0392b; color: white; }
.skip { background: #7f8c8d; color: white; }

.row {
  display: flex;
  gap: 10px;
}

#progressWrap {
  height: 10px;
  background: #ddd;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #27ae60;
  transition: width 0.2s;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="name" id="name">Loading...</div>

    <div class="meta">
      Qty: <span id="qty"></span> |
      Price: $<span id="price"></span>
    </div>

    <input id="priceInput" type="number" placeholder="Update price (optional)">

    <button class="yes" onclick="yes()">YES</button>
    <button class="no" onclick="missing()">MISSING</button>

    <div class="row">
      <button class="skip" onclick="skip()">SKIP</button>
      <button class="skip" onclick="back()">BACK</button>
    </div>

    <button onclick="resetInventory()" style="background:#333;color:white;">
      RESET
    </button>

  </div>
</div>

<div id="progressWrap">
  <div id="progressBar"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwquwleZThz900yvRXY2AoIqZp_Lyc1BUKZS68op3NM-jdb-zkmih4-bhPdTD0TiCRzKQ/exec";

let batch = [];
let currentRow = null;
let startRow = 1;
let lastSheetRow = 1;
let locked = false;

/* LOAD */
function loadBatch() {
  fetch(SCRIPT_URL + "?action=batch")
    .then(r => r.json())
    .then(data => {

      if (!data.items || data.items.length === 0) {
        document.body.innerHTML = "<h2 style='text-align:center;margin-top:100px;'>Done ✅</h2>";
        return;
      }

      batch = data.items;

      startRow = batch[0].row;
      lastSheetRow = data.lastRow;

      render(batch[0]);
    })
    .catch(() => {
      document.body.innerHTML = "<h2>Load failed</h2>";
    });
}

/* RENDER */
function render(item) {
  currentRow = item.row;

  name.innerText = item.name;
  qty.innerText = item.qty;
  price.innerText = item.price;

  priceInput.value = "";

  updateProgress();
  locked = false;
}

/* PROGRESS */
function updateProgress() {
  let percent =
    ((currentRow - startRow) / (lastSheetRow - startRow)) * 100;

  percent = Math.max(0, Math.min(100, percent));
  progressBar.style.width = percent + "%";
}

/* NEXT */
function nextItem() {
  const next = batch.find(i => i.row > currentRow);
  if (next) render(next);
  else loadBatch();
}

/* ACTIONS */
function yes() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=yes&row=" + currentRow + "&price=" + priceInput.value);
  nextItem();
}

function missing() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=missing&row=" + currentRow);
  nextItem();
}

function skip() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=skip&row=" + currentRow);
  nextItem();
}

function back() {
  fetch(SCRIPT_URL + "?action=back")
    .then(() => loadBatch());
}

/* RESET */
function resetInventory() {
  if (!confirm("Start from the beginning?")) return;

  fetch(SCRIPT_URL + "?action=reset")
    .then(() => loadBatch());
}

/* START */
loadBatch();
</script>

</body>
</html>

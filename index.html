<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase Audit</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-top: 40px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .qty {
      font-size: 18px;
      color: #555;
      margin-bottom: 15px;
    }

    .progress {
      font-size: 14px;
      color: #888;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
    }

    .yes { background: #2ecc71; color: white; }
    .no { background: #e74c3c; color: white; }
    .skip { background: #777; color: white; }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <div class="name" id="name">Loading...</div>
    <div class="qty">Qty: <span id="qty"></span></div>
    <div class="progress" id="progress"></div>

    <button class="yes" onclick="mark(true)">YES</button>
    <button class="no" onclick="mark(false)">NO</button>
    <button class="skip" onclick="skip()">SKIP</button>

    <div id="status"></div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6IVM7_0ucXTYXzxqZLc9y-s6W8sqIxWsUhW10PFwhTlI9j87HCeLya9iyU40jOzGc/exec";

let currentRow = 1;
let total = 0;

function loadNext() {
  fetch(SCRIPT_URL + "?action=getNext")
    .then(r => r.json())
    .then(data => {
      if (!data) {
        document.body.innerHTML = "<h2 style='text-align:center;margin-top:100px;'>All items complete ✅</h2>";
        return;
      }

      currentRow = data.row;
      total = data.total || total;

      document.getElementById("name").innerText = data.name;
      document.getElementById("qty").innerText = data.qty;

      document.getElementById("progress").innerText =
        "Item " + data.row + " of ~" + (total || "?");

      document.getElementById("status").innerText = "";
    });
}

function mark(present) {
  fetch(SCRIPT_URL + "?action=update&row=" + currentRow + "&present=" + present)
    .then(() => loadNext());
}

function skip() {
  fetch(SCRIPT_URL + "?action=skip&row=" + currentRow)
    .then(() => loadNext());
}

loadNext();
</script>

</body>
</html>

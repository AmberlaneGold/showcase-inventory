<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwquwleZThz900yvRXY2AoIqZp_Lyc1BUKZS68op3NM-jdb-zkmih4-bhPdTD0TiCRzKQ/exec";

let batch = [];
let currentRow = null;
let startRow = 1;
let lastSheetRow = 1;
let locked = false;

/* ---------------- SAFE FETCH ---------------- */

async function safeFetch(url) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    const text = await res.text();

    try {
      return JSON.parse(text);
    } catch (e) {
      console.log("BAD RESPONSE:", text);
      return null;
    }

  } catch (err) {
    console.log("FETCH ERROR:", err);
    return null;
  }
}

/* ---------------- LOAD ---------------- */

async function loadBatch() {
  document.getElementById("status").innerText = "Loading...";

  const data = await safeFetch(SCRIPT_URL + "?action=batch");

  if (!data || !data.items) {
    document.getElementById("status").innerText = "Retrying...";
    setTimeout(loadBatch, 1500);
    return;
  }

  batch = data.items;

  if (!batch.length) {
    document.getElementById("status").innerText = "No items — retrying...";
    setTimeout(loadBatch, 1500);
    return;
  }

  startRow = batch[0].row;
  lastSheetRow = data.lastRow || startRow;

  render(batch[0]);
}

/* ---------------- RENDER ---------------- */

function render(item) {
  currentRow = item.row;

  document.getElementById("name").innerText = item.name;
  document.getElementById("qty").innerText = item.qty;
  document.getElementById("price").innerText = item.price;

  document.getElementById("priceInput").value = "";

  document.getElementById("status").innerText = "Row " + currentRow;

  updateProgress();
  locked = false;
}

/* ---------------- PROGRESS ---------------- */

function updateProgress() {
  let percent =
    ((currentRow - startRow) / (lastSheetRow - startRow)) * 100;

  percent = Math.max(0, Math.min(100, percent));

  document.getElementById("progressBar").style.width = percent + "%";
}

/* ---------------- NEXT ---------------- */

function nextItem() {
  const next = batch.find(i => i.row > currentRow);

  if (next) {
    render(next);
  } else {
    loadBatch();
  }
}

/* ---------------- ACTIONS ---------------- */

function yes() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=yes&row=" + currentRow + "&price=" + priceInput.value)
    .catch(() => {});

  nextItem();
}

function missing() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=missing&row=" + currentRow)
    .catch(() => {});

  nextItem();
}

function skip() {
  if (locked) return;
  locked = true;

  fetch(SCRIPT_URL + "?action=skip&row=" + currentRow)
    .catch(() => {});

  nextItem();
}

function back() {
  fetch(SCRIPT_URL + "?action=back")
    .then(() => loadBatch())
    .catch(() => loadBatch());
}

/* ---------------- START ---------------- */

loadBatch();
</script>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase Audit</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f4f4;
}

.wrap {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  margin-top: 40px;
  text-align: center;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.name { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
.qty, .price { font-size: 16px; color: #555; margin-bottom: 10px; }

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  margin-top: 10px;
}

.yes { background: #2ecc71; color: white; }
.no { background: #e74c3c; color: white; }
.skip { background: #777; color: white; }

#status {
  font-size: 13px;
  color: #666;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">
  <div class="name" id="name">Loading...</div>

  <div class="qty">Qty: <span id="qty"></span></div>
  <div class="price">Price: <span id="price"></span></div>

  <input id="priceInput" type="number" placeholder="Price (optional)">

  <button class="yes" id="yesBtn">YES</button>
  <button class="no" onclick="missing()">MISSING (hold)</button>
  <button class="skip" onclick="skip()">SKIP</button>
  <button class="skip" onclick="back()">⬅ BACK</button>

  <div id="status"></div>
</div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkkuqjlnWdnVWEVngLiDx8LRmS_8yj1hsWWdvuFnKR3oJzVObP8qmieikVoppxvXaTSQ/exec";

let batch = [];
let index = 0;
let currentRow = null;
let longPressTimer;

/**
 * 🔥 LOAD BATCH
 */
function loadBatch() {
  fetch(SCRIPT_URL + "?action=batch")
    .then(r => r.json())
    .then(data => {

      batch = data.items;
      index = 0;

      if (!batch.length) {
        document.body.innerHTML =
          "<h2 style='text-align:center;margin-top:100px;'>Done ✅</h2>";
        return;
      }

      startRow = batch[0].row;

      // 🔥 TRUE last data row from full sheet scan (passed from backend)
      lastSheetRow = data.lastRow;

      render(batch[index]);
      updateProgress();
    });
}

/**
 * ⚡ RENDER ITEM
 */
function render(item) {
  currentRow = item.row;

  document.getElementById("name").innerText = item.name;
  document.getElementById("qty").innerText = item.qty;
  document.getElementById("price").innerText = item.price;

  document.getElementById("priceInput").value = "";
}

/**
 * ⚡ INSTANT NEXT (NO WAIT)
 */
function nextLocal() {
  index++;

  if (index >= batch.length) {
    loadBatch();
  } else {
    render(batch[index]);
  }
}

/**
 * 🚀 YES (INSTANT UI + BACKGROUND SYNC)
 */
function yes() {
  const price = document.getElementById("priceInput").value;

  nextLocal(); // 👈 instant UI update FIRST

  fetch(SCRIPT_URL + "?action=yes&row=" + currentRow + "&price=" + price);
}

/**
 * 🚀 MISS (INSTANT)
 */
function missing() {
  nextLocal();
  fetch(SCRIPT_URL + "?action=missing&row=" + currentRow);
}

/**
 * 🚀 SKIP (INSTANT)
 */
function skip() {
  nextLocal();
  fetch(SCRIPT_URL + "?action=skip&row=" + currentRow);
}

/**
 * BACK (local first, server fallback)
 */
function back() {
  if (index > 0) {
    index--;
    render(batch[index]);
  } else {
    fetch(SCRIPT_URL + "?action=back")
      .then(() => loadBatch());
  }
}

/**
 * YES BUTTON + LONG PRESS
 */
const yesBtn = document.getElementById("yesBtn");

yesBtn.addEventListener("mousedown", startPress);
yesBtn.addEventListener("touchstart", startPress);
yesBtn.addEventListener("mouseup", endPress);
yesBtn.addEventListener("mouseleave", endPress);
yesBtn.addEventListener("touchend", endPress);

function startPress() {
  longPressTimer = setTimeout(() => {
    missing();
  }, 700);
}

function endPress() {
  clearTimeout(longPressTimer);
  yes();
}

loadBatch();
</script>

</body>
</html>

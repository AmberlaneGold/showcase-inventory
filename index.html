<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase Audit</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-top: 40px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .qty, .price {
      font-size: 16px;
      color: #555;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
    }

    .yes { background: #2ecc71; color: white; }
    .no { background: #e74c3c; color: white; }
    .skip { background: #777; color: white; }

    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <div class="name" id="name">Loading...</div>

    <div class="qty">Qty: <span id="qty"></span></div>
    <div class="price">Price: <span id="price"></span></div>

    <input id="priceInput" type="number" placeholder="Price (optional)">

    <button class="yes" id="yesBtn">YES</button>
    <button class="no" onclick="missing()">LONG PRESS = MISSING</button>
    <button class="skip" onclick="skip()">SKIP</button>
    <button class="skip" onclick="back()">⬅ BACK</button>

    <div id="status"></div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS9FgGenPowxB9vs3Ca6sV2S0laimsutN3GsiYmx0yhHJMJwG8u7hT3BUBrHADjsNRtQ/exec";

let currentRow = 1;
let longPressTimer;

function loadNext() {
  fetch(SCRIPT_URL + "?action=getNext")
    .then(r => r.json())
    .then(data => {
      if (!data) {
        document.body.innerHTML = "<h2 style='text-align:center;margin-top:100px;'>All done ✅</h2>";
        return;
      }

      currentRow = data.row;

      document.getElementById("name").innerText = data.name;
      document.getElementById("qty").innerText = data.qty;
      document.getElementById("price").innerText = data.price;

      document.getElementById("priceInput").value = "";
    });
}

/**
 * YES BUTTON (tap / long press)
 */
const yesBtn = document.getElementById("yesBtn");

yesBtn.addEventListener("mousedown", startPress);
yesBtn.addEventListener("touchstart", startPress);

yesBtn.addEventListener("mouseup", endPress);
yesBtn.addEventListener("mouseleave", endPress);
yesBtn.addEventListener("touchend", endPress);

function startPress() {
  longPressTimer = setTimeout(() => {
    missing();
  }, 700);
}

function endPress() {
  clearTimeout(longPressTimer);
  yes();
}

function yes() {
  const price = document.getElementById("priceInput").value;

  fetch(SCRIPT_URL + "?action=yes&row=" + currentRow + "&price=" + price)
    .then(() => loadNext());
}

function missing() {
  fetch(SCRIPT_URL + "?action=missing&row=" + currentRow)
    .then(() => loadNext());
}

function skip() {
  fetch(SCRIPT_URL + "?action=skip&row=" + currentRow)
    .then(() => loadNext());
}

function back() {
  fetch(SCRIPT_URL + "?action=back")
    .then(() => loadNext());
}

loadNext();
</script>

</body>
</html>
